version: 2
updates:
  # Maven deps for the connector module. Security + version drift on the large Hadoop graph.
  - package-ecosystem: maven
    directory: /delta-sink-connector
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # one PR for the lockstep-pinned families so they don't drift apart
      jackson:
        patterns: ["com.fasterxml.jackson*"]
      delta-kernel:
        patterns: ["io.delta:*"]
      hadoop:
        patterns: ["org.apache.hadoop:*"]

  # Keep the GitHub Actions used by CI current (also a supply-chain surface).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
