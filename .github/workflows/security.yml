name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly — surface CVEs newly disclosed against unchanged dependencies
    - cron: "17 6 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cve-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # SBOM of the shipped artifact (provided/test scopes excluded in the pom). `package` resolves the
      # full dependency graph and fires the package-bound cyclonedx execution; enforcer also runs (via
      # the validate phase: dependency convergence + banned-deps).
      - name: Generate CycloneDX SBOM
        run: mvn -B -DskipTests package
        working-directory: delta-sink-connector
      # Fail on any HIGH/CRITICAL. We do NOT pass --ignore-unfixed: an unfixed-but-disclosed CVE should
      # surface (that's the point of the weekly schedule); accepted ones are justified in .trivyignore.
      # Run the pinned official image rather than a floating action tag so the gate is reproducible.
      - name: Trivy CVE scan
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.70.0 \
            sbom delta-sink-connector/target/bom.json \
            --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile /repo/.trivyignore

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # full history so a secret committed earlier is still caught
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Run the image directly: the gitleaks GitHub Action requires a (free) license key for org
      # accounts, the CLI does not. Exits non-zero on any finding; --redact keeps secrets out of logs.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --no-banner --redact
