name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # offline suite only; live + benchmark tests are env-gated and auto-skip.
      - run: mvn -B test
        working-directory: delta-sink-connector
